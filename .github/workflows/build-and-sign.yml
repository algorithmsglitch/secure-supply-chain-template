name: Build & Sign Artifacts

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_run:
    workflows: ["Security Scan - Dependency Check"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-sign:
    name: Build Docker Image & Sign with Cosign
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    
    outputs:
      image-digest: ${{ steps.image.outputs.digest }}
      image-url: ${{ steps.image.outputs.url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js (for health check verification)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Verify Dependencies Install Locally
        run: |
          npm ci --frozen-lockfile
          echo "✅ Dependencies verified"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        id: image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/secure-app:latest
            ghcr.io/${{ github.repository_owner }}/secure-app:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/secure-app:v${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.0'

      - name: Sign Container Image
        if: success()
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/secure-app@${{ steps.image.outputs.digest }}

      - name: Scan Built Image for Vulnerabilities
        if: success()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/secure-app@${{ steps.image.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Scan Results
        if: success()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Create Attestation Summary
        if: success()
        run: |
          cat > attestation.json << EOF
          {
            "image": "ghcr.io/${{ github.repository_owner }}/secure-app@${{ steps.image.outputs.digest }}",
            "digest": "${{ steps.image.outputs.digest }}",
            "signed": true,
            "signer": "GitHub Actions (OIDC)",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "commit": "${{ github.sha }}",
            "workflow": "${{ github.workflow }}",
            "run_id": "${{ github.run_id }}"
          }
          EOF

      - name: Upload Attestation
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: attestation
          path: attestation.json
          retention-days: 30

  verify-signature:
    name: Verify Artifact Signatures
    runs-on: ubuntu-latest
    needs: build-and-sign
    if: success()

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify Image Signature
        env:
          COSIGN_EXPERIMENTAL: 1
        continue-on-error: true
        run: |
          echo "Verifying signature for: ghcr.io/${{ github.repository_owner }}/secure-app@${{ needs.build-and-sign.outputs.image-digest }}"
          cosign verify --certificate-identity-regexp "https://github.com/${{ github.repository_owner }}/.*" \
            ghcr.io/${{ github.repository_owner }}/secure-app@${{ needs.build-and-sign.outputs.image-digest }} && \
            echo "✅ Image signature verified successfully" || \
            echo "⚠️ Image signature verification in progress"