name: Build & Sign Artifacts

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_run:
    workflows: ["Security Scan - Dependency Check"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-sign:
    name: Build Docker Image & Sign with Cosign
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    
    outputs:
      image-digest: ${{ steps.image.outputs.digest }}
      image-url: ${{ steps.image.outputs.url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        id: image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/secure-app:latest
            ghcr.io/${{ github.repository_owner }}/secure-app:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/secure-app:v${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.0'

      - name: Sign Container Image
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign --yes ghcr.io/${{ github.repository_owner }}/secure-app@${{ steps.image.outputs.digest }}

      - name: Scan Built Image for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/secure-app@${{ steps.image.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Scan Results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Create Attestation Summary
        run: |
          cat > attestation.json << EOF
          {
            "image": "ghcr.io/${{ github.repository_owner }}/secure-app@${{ steps.image.outputs.digest }}",
            "digest": "${{ steps.image.outputs.digest }}",
            "signed": true,
            "signer": "GitHub Actions (OIDC)",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "commit": "${{ github.sha }}",
            "workflow": "${{ github.workflow }}",
            "run_id": "${{ github.run_id }}"
          }
          EOF

      - name: Upload Attestation
        uses: actions/upload-artifact@v3
        with:
          name: attestation
          path: attestation.json

  verify-signature:
    name: Verify Artifact Signatures
    runs-on: ubuntu-latest
    needs: build-and-sign
    if: always()

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify Image Signature
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign verify --certificate-identity-regexp "https://github.com/${{ github.repository_owner }}/.*" \
            ghcr.io/${{ github.repository_owner }}/secure-app@${{ needs.build-and-sign.outputs.image-digest }}
          
          if [ $? -eq 0 ]; then
            echo "✅ Image signature verified successfully"
          else
            echo "❌ Image signature verification failed"
            exit 1
          fi